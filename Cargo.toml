[workspace]
members = ["apps/desktop/src-tauri", "crates/desktop-capture", "crates/desktop-input", "crates/desktop-accessibility"]
exclude = ["vender/rust-sdks"]
resolver = "2"

[patch.crates-io]
libwebrtc = { git = "https://github.com/99percentpeople/rust-sdks.git", rev = "ab1c328503295a67402200c93645ae4d3f56513f" }
webrtc-sys = { git = "https://github.com/99percentpeople/rust-sdks.git", rev = "ab1c328503295a67402200c93645ae4d3f56513f" }

[profile.release]
codegen-units = 1
lto = true
strip = true
