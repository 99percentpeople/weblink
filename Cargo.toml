[workspace]
members = ["apps/desktop/src-tauri", "crates/desktop-capture", "crates/desktop-input", "crates/desktop-accessibility"]
exclude = ["vender/rust-sdks"]
resolver = "2"

[patch.crates-io]
libwebrtc = { git = "https://github.com/99percentpeople/rust-sdks.git", rev = "45c90ead0cfb1ffa01ab3ac53689ed0b8f664347" }
webrtc-sys = { git = "https://github.com/99percentpeople/rust-sdks.git", rev = "45c90ead0cfb1ffa01ab3ac53689ed0b8f664347" }

[profile.release]
codegen-units = 1
lto = true
strip = true
