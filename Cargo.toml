[workspace]
members = ["apps/desktop/src-tauri", "crates/desktop-capture", "crates/desktop-input", "crates/desktop-accessibility"]
exclude = ["vender/rust-sdks"]
resolver = "2"

[patch.crates-io]
libwebrtc = { git = "https://github.com/99percentpeople/rust-sdks.git", rev = "5acf8d9fc182c0f7c4ec502062c002f3ab6dbdfa" }
webrtc-sys = { git = "https://github.com/99percentpeople/rust-sdks.git", rev = "5acf8d9fc182c0f7c4ec502062c002f3ab6dbdfa" }

[profile.release]
codegen-units = 1
lto = true
strip = true
