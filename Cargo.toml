[workspace]
members = ["apps/desktop/src-tauri", "crates/desktop-capture", "crates/desktop-input", "crates/desktop-accessibility"]
exclude = ["vender/rust-sdks"]
resolver = "2"

[patch.crates-io]
libwebrtc = { git = "https://github.com/99percentpeople/rust-sdks.git", rev = "8df4f6e0bcd1bec1e7ed43c7a0c1ab68c0db4177" }
webrtc-sys = { git = "https://github.com/99percentpeople/rust-sdks.git", rev = "8df4f6e0bcd1bec1e7ed43c7a0c1ab68c0db4177" }

[profile.release]
codegen-units = 1
lto = true
strip = true
