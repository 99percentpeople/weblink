exclude = ["vender/rust-sdks"]
resolver = "2"

[patch.crates-io]
libwebrtc = { git = "https://github.com/99percentpeople/rust-sdks.git", rev = "83784aff6d63e80a8194419feece83350c5b4f5e" }
