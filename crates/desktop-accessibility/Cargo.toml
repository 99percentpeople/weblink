[package]
name = "weblink-desktop-accessibility"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"

[dependencies]
weblink-desktop-input = { path = "../desktop-input" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
] }
