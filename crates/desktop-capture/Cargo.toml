[package]
name = "weblink-desktop-capture"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-capture = "=2.0.1"
windows = { version = "0.62.2", features = ["Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }
