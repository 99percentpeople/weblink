[package]
name = "weblink-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"

[lib]
name = "weblink_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = ["tray-icon"] }
tauri-plugin-opener = "=2.6.0"
tauri-plugin-single-instance = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
weblink-desktop-input = { path = "../../../crates/desktop-input" }
weblink-desktop-capture = { path = "../../../crates/desktop-capture" }
tauri-plugin-autostart = "=2.6.0"
base64 = "0.22"
png = "0.18"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
sha2 = "0.10"
winreg = "0.55"
webview2-com = "=0.39.1"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole", "Win32_UI_Accessibility", "UI_Notifications", "Data_Xml_Dom", "Foundation_Collections"] }

[target.'cfg(windows)'.dev-dependencies]
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop"] }
