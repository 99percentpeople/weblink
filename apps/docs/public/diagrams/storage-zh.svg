<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 784"
  lang="zh-CN"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">文件提交、恢复与发布</title>
  <desc id="desc">
    接收方先提交数据字节，再记录分块检查点。重开文件时验证检查点并请求缺失分块。完整内容通过验证后才能发布，验证或发布失败仍保留未完成数据。
  </desc>
  <defs>
    <marker
      id="control-arrow"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="5"
      orient="auto-start-reverse"
    >
      <path
        d="M2 1L8 5L2 9"
        fill="none"
        stroke="var(--signal)"
        stroke-width="1.5"
      />
    </marker>
    <marker
      id="data-arrow"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="5"
      orient="auto-start-reverse"
    >
      <path
        d="M2 1L8 5L2 9"
        fill="none"
        stroke="var(--content)"
        stroke-width="1.5"
      />
    </marker>
    <marker
      id="retry-arrow"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="5"
      orient="auto-start-reverse"
    >
      <path
        d="M2 1L8 5L2 9"
        fill="none"
        stroke="var(--signal)"
        stroke-width="1.5"
      />
    </marker>
    <style>
      :root {
        --canvas: #f8fafc;
        --frame: #dbe3ed;
        --node: #ffffff;
        --border: #cbd5e1;
        --text: #1e293b;
        --muted: #475569;
        --signal: #64748b;
        --content: #315fa8;
        --accent-bg: #edf3fc;
        --accent-border: #a7bfdf;
        --success-bg: #edf7f1;
        --success-border: #a5cdb6;
        --warning-bg: #fff7e8;
        --warning-border: #d6b879;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #151a23;
          --frame: #374151;
          --node: #20252e;
          --border: #465368;
          --text: #e9edf5;
          --muted: #b2bed0;
          --signal: #94a3b8;
          --content: #96b9ff;
          --accent-bg: #24344b;
          --accent-border: #4d6793;
          --success-bg: #213b30;
          --success-border: #4c8062;
          --warning-bg: #3b3020;
          --warning-border: #8e7444;
        }
      }
      text {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          "Microsoft YaHei",
          sans-serif;
        fill: var(--text);
      }
      .title {
        font-size: 22px;
        font-weight: 650;
      }
      .node-title {
        font-size: 18px;
        font-weight: 600;
      }
      .detail {
        font-size: 16px;
        fill: var(--muted);
      }
      .label {
        font-size: 16px;
        paint-order: stroke;
        stroke: var(--canvas);
        stroke-width: 5px;
        stroke-linejoin: round;
      }
      .section {
        font-size: 17px;
        font-weight: 600;
      }
      .canvas {
        fill: var(--canvas);
        stroke: var(--frame);
      }
      .panel {
        fill: none;
        stroke: var(--frame);
      }
      .node rect,
      .node path {
        fill: var(--node);
        stroke: var(--border);
        stroke-width: 1.5;
      }
      .accent rect,
      .decision path {
        fill: var(--accent-bg);
        stroke: var(--accent-border);
      }
      .success rect {
        fill: var(--success-bg);
        stroke: var(--success-border);
      }
      .warning rect {
        fill: var(--warning-bg);
        stroke: var(--warning-border);
      }
      .note rect {
        fill: none;
        stroke: var(--frame);
      }
      .edge {
        fill: none;
        stroke-width: 2;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .control {
        stroke: var(--signal);
      }
      .data {
        stroke: var(--content);
        stroke-width: 2.5;
      }
      .retry {
        stroke: var(--signal);
        stroke-dasharray: 6 5;
      }
      .lifeline {
        fill: none;
        stroke: var(--frame);
        stroke-width: 1.5;
        stroke-dasharray: 5 6;
      }
    </style>
  </defs>
  <rect
    class="canvas"
    x="1"
    y="1"
    width="898"
    height="782"
    rx="16"
  />
  <text x="32" y="39" class="title" text-anchor="start">
    文件提交、恢复与发布
  </text>
  <path
    class="edge data"
    d="M205 166L205 224"
    marker-end="url(#data-arrow)"
  />
  <path
    class="edge data"
    d="M205 294L205 352"
    marker-end="url(#data-arrow)"
  />
  <path
    class="edge control"
    d="M205 422L205 480"
    marker-end="url(#control-arrow)"
  />
  <path
    class="edge control"
    d="M205 550L205 608"
    marker-end="url(#control-arrow)"
  />
  <path
    class="edge retry"
    d="M325 259L545 259"
    marker-end="url(#retry-arrow)"
  />
  <text x="435" y="247" class="label" text-anchor="middle">
    中断后重新打开
  </text>
  <path
    class="edge retry"
    d="M685 294L685 352"
    marker-end="url(#retry-arrow)"
  />
  <path
    class="edge retry"
    d="M685 422L685 480"
    marker-end="url(#retry-arrow)"
  />
  <path
    class="edge retry"
    d="M825 515H855V131H325"
    marker-end="url(#retry-arrow)"
  />
  <path
    class="edge control"
    d="M325 515H400V643H545"
    marker-end="url(#control-arrow)"
  />
  <path
    class="edge control"
    d="M325 643L545 643"
    marker-end="url(#control-arrow)"
  />
  <text x="435" y="631" class="label" text-anchor="middle">
    发布失败
  </text>
  <g class="node accent">
    <rect x="85" y="96" width="240" height="70" rx="12" />
    <text
      x="205"
      y="125"
      class="node-title"
      text-anchor="middle"
    >
      接收分块
    </text>
    <text
      x="205"
      y="149"
      class="detail"
      text-anchor="middle"
    >
      原始文件字节
    </text>
  </g>
  <g class="node">
    <rect x="85" y="224" width="240" height="70" rx="12" />
    <text
      x="205"
      y="253"
      class="node-title"
      text-anchor="middle"
    >
      提交数据字节
    </text>
    <text
      x="205"
      y="277"
      class="detail"
      text-anchor="middle"
    >
      写入对应分块偏移
    </text>
  </g>
  <g class="node success">
    <rect x="85" y="352" width="240" height="70" rx="12" />
    <text
      x="205"
      y="381"
      class="node-title"
      text-anchor="middle"
    >
      提交检查点
    </text>
    <text
      x="205"
      y="405"
      class="detail"
      text-anchor="middle"
    >
      序号 + BLAKE3 摘要
    </text>
  </g>
  <g class="node">
    <rect x="85" y="480" width="240" height="70" rx="12" />
    <text
      x="205"
      y="509"
      class="node-title"
      text-anchor="middle"
    >
      校验完整内容
    </text>
    <text
      x="205"
      y="533"
      class="detail"
      text-anchor="middle"
    >
      比对预期内容指纹
    </text>
  </g>
  <g class="node success">
    <rect x="85" y="608" width="240" height="70" rx="12" />
    <text
      x="205"
      y="637"
      class="node-title"
      text-anchor="middle"
    >
      发布完整文件
    </text>
    <text
      x="205"
      y="661"
      class="detail"
      text-anchor="middle"
    >
      完成名称与元数据
    </text>
  </g>
  <g class="node">
    <rect x="545" y="224" width="280" height="70" rx="12" />
    <text
      x="685"
      y="253"
      class="node-title"
      text-anchor="middle"
    >
      打开未完成文件
    </text>
    <text
      x="685"
      y="277"
      class="detail"
      text-anchor="middle"
    >
      读取元数据与尾部
    </text>
  </g>
  <g class="node">
    <rect x="545" y="352" width="280" height="70" rx="12" />
    <text
      x="685"
      y="381"
      class="node-title"
      text-anchor="middle"
    >
      验证检查点摘要
    </text>
    <text
      x="685"
      y="405"
      class="detail"
      text-anchor="middle"
    >
      与实际字节比对
    </text>
  </g>
  <g class="node accent">
    <rect x="545" y="480" width="280" height="70" rx="12" />
    <text
      x="685"
      y="509"
      class="node-title"
      text-anchor="middle"
    >
      请求缺失分块
    </text>
    <text
      x="685"
      y="533"
      class="detail"
      text-anchor="middle"
    >
      仅复用通过验证的分块
    </text>
  </g>
  <g class="node warning">
    <rect x="545" y="608" width="280" height="70" rx="12" />
    <text
      x="685"
      y="637"
      class="node-title"
      text-anchor="middle"
    >
      保留未完成数据
    </text>
    <text
      x="685"
      y="661"
      class="detail"
      text-anchor="middle"
    >
      等待重新校验或发布
    </text>
  </g>
  <text x="587" y="115" class="label" text-anchor="middle">
    继续接收缺失分块
  </text>
  <text x="228" y="458" class="label" text-anchor="start">
    所有分块已到齐
  </text>
  <text x="228" y="585" class="label" text-anchor="start">
    验证通过
  </text>
  <text x="417" y="589" class="label" text-anchor="start">
    失败
  </text>
  <g class="node note">
    <rect x="32" y="718" width="836" height="42" rx="12" />
    <text
      x="450"
      y="745"
      class="detail"
      text-anchor="middle"
    >
      未写入检查点的字节和预分配空间，都不能算作可恢复的进度。
    </text>
  </g>
</svg>
