<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 648"
  lang="zh-CN"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">原生接收：解码与 GPU 显示</title>
  <desc id="desc">
    原生 WebRTC 将媒体交给硬件或原生软件解码器。硬件输出保留
    D3D11 纹理，软件输出经有界纹理池上传，两者进入共用 GPU
    显示层和 DirectComposition。录制另行请求 CPU
    回读，不替换 GPU 显示通路。
  </desc>
  <defs>
    <marker
      id="control-arrow"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="5"
      orient="auto-start-reverse"
    >
      <path
        d="M2 1L8 5L2 9"
        fill="none"
        stroke="var(--signal)"
        stroke-width="1.5"
      />
    </marker>
    <marker
      id="data-arrow"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="5"
      orient="auto-start-reverse"
    >
      <path
        d="M2 1L8 5L2 9"
        fill="none"
        stroke="var(--content)"
        stroke-width="1.5"
      />
    </marker>
    <marker
      id="retry-arrow"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="5"
      orient="auto-start-reverse"
    >
      <path
        d="M2 1L8 5L2 9"
        fill="none"
        stroke="var(--signal)"
        stroke-width="1.5"
      />
    </marker>
    <style>
      :root {
        --canvas: #f8fafc;
        --frame: #dbe3ed;
        --node: #ffffff;
        --border: #cbd5e1;
        --text: #1e293b;
        --muted: #475569;
        --signal: #64748b;
        --content: #315fa8;
        --accent-bg: #edf3fc;
        --accent-border: #a7bfdf;
        --success-bg: #edf7f1;
        --success-border: #a5cdb6;
        --warning-bg: #fff7e8;
        --warning-border: #d6b879;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #151a23;
          --frame: #374151;
          --node: #20252e;
          --border: #465368;
          --text: #e9edf5;
          --muted: #b2bed0;
          --signal: #94a3b8;
          --content: #96b9ff;
          --accent-bg: #24344b;
          --accent-border: #4d6793;
          --success-bg: #213b30;
          --success-border: #4c8062;
          --warning-bg: #3b3020;
          --warning-border: #8e7444;
        }
      }
      text {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          "Microsoft YaHei",
          sans-serif;
        fill: var(--text);
      }
      .title {
        font-size: 22px;
        font-weight: 650;
      }
      .node-title {
        font-size: 18px;
        font-weight: 600;
      }
      .detail {
        font-size: 16px;
        fill: var(--muted);
      }
      .label {
        font-size: 16px;
        paint-order: stroke;
        stroke: var(--canvas);
        stroke-width: 5px;
        stroke-linejoin: round;
      }
      .section {
        font-size: 17px;
        font-weight: 600;
      }
      .canvas {
        fill: var(--canvas);
        stroke: var(--frame);
      }
      .panel {
        fill: none;
        stroke: var(--frame);
      }
      .node rect,
      .node path {
        fill: var(--node);
        stroke: var(--border);
        stroke-width: 1.5;
      }
      .accent rect,
      .decision path {
        fill: var(--accent-bg);
        stroke: var(--accent-border);
      }
      .success rect {
        fill: var(--success-bg);
        stroke: var(--success-border);
      }
      .warning rect {
        fill: var(--warning-bg);
        stroke: var(--warning-border);
      }
      .note rect {
        fill: none;
        stroke: var(--frame);
      }
      .edge {
        fill: none;
        stroke-width: 2;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .control {
        stroke: var(--signal);
      }
      .data {
        stroke: var(--content);
        stroke-width: 2.5;
      }
      .retry {
        stroke: var(--signal);
        stroke-dasharray: 6 5;
      }
      .lifeline {
        fill: none;
        stroke: var(--frame);
        stroke-width: 1.5;
        stroke-dasharray: 5 6;
      }
    </style>
  </defs>
  <rect
    class="canvas"
    x="1"
    y="1"
    width="898"
    height="646"
    rx="16"
  />
  <text x="32" y="39" class="title" text-anchor="start">
    原生接收：解码与 GPU 显示
  </text>
  <path
    class="edge control"
    d="M280 131L325 131"
    marker-end="url(#control-arrow)"
  />
  <path
    class="edge data"
    d="M575 131L620 131"
    marker-end="url(#data-arrow)"
  />
  <path
    class="edge retry"
    d="M155 174L155 295"
    marker-end="url(#retry-arrow)"
  />
  <path
    class="edge data"
    d="M745 174L745 295"
    marker-end="url(#data-arrow)"
  />
  <path
    class="edge retry"
    d="M280 338L325 338"
    marker-end="url(#retry-arrow)"
  />
  <path
    class="edge data"
    d="M575 338L620 338"
    marker-end="url(#data-arrow)"
  />
  <path
    class="edge data"
    d="M745 381L745 468"
    marker-end="url(#data-arrow)"
  />
  <path
    class="edge retry"
    d="M620 338H596V511H575"
    marker-end="url(#retry-arrow)"
  />
  <g class="node">
    <rect x="30" y="88" width="250" height="86" rx="12" />
    <text
      x="155"
      y="125"
      class="node-title"
      text-anchor="middle"
    >
      原生 WebRTC
    </text>
    <text
      x="155"
      y="149"
      class="detail"
      text-anchor="middle"
    >
      RTP 编码媒体
    </text>
  </g>
  <g class="node accent">
    <rect x="325" y="88" width="250" height="86" rx="12" />
    <text
      x="450"
      y="125"
      class="node-title"
      text-anchor="middle"
    >
      原生硬件解码
    </text>
    <text
      x="450"
      y="149"
      class="detail"
      text-anchor="middle"
    >
      Media Foundation
    </text>
  </g>
  <g class="node accent">
    <rect x="620" y="88" width="250" height="86" rx="12" />
    <text
      x="745"
      y="125"
      class="node-title"
      text-anchor="middle"
    >
      解码后的 GPU 纹理
    </text>
    <text
      x="745"
      y="149"
      class="detail"
      text-anchor="middle"
    >
      D3D11 · 帧使用租约
    </text>
  </g>
  <text x="155" y="253" class="label" text-anchor="middle">
    软件解码通路
  </text>
  <g class="node">
    <rect x="30" y="295" width="250" height="86" rx="12" />
    <text
      x="155"
      y="332"
      class="node-title"
      text-anchor="middle"
    >
      原生软件解码
    </text>
    <text
      x="155"
      y="356"
      class="detail"
      text-anchor="middle"
    >
      CPU 像素输出
    </text>
  </g>
  <g class="node">
    <rect x="325" y="295" width="250" height="86" rx="12" />
    <text
      x="450"
      y="332"
      class="node-title"
      text-anchor="middle"
    >
      上传到 D3D11
    </text>
    <text
      x="450"
      y="356"
      class="detail"
      text-anchor="middle"
    >
      有界 NV12 纹理池
    </text>
  </g>
  <g class="node accent">
    <rect x="620" y="295" width="250" height="86" rx="12" />
    <text
      x="745"
      y="332"
      class="node-title"
      text-anchor="middle"
    >
      共用 GPU 显示层
    </text>
    <text
      x="745"
      y="356"
      class="detail"
      text-anchor="middle"
    >
      D3D11 图像处理
    </text>
  </g>
  <text x="450" y="447" class="label" text-anchor="middle">
    仅录制时使用
  </text>
  <g class="node warning">
    <rect x="325" y="468" width="250" height="86" rx="12" />
    <text
      x="450"
      y="505"
      class="node-title"
      text-anchor="middle"
    >
      录制消费者
    </text>
    <text
      x="450"
      y="529"
      class="detail"
      text-anchor="middle"
    >
      有界 CPU 回读
    </text>
  </g>
  <g class="node accent">
    <rect x="620" y="468" width="250" height="86" rx="12" />
    <text
      x="745"
      y="505"
      class="node-title"
      text-anchor="middle"
    >
      DirectComposition
    </text>
    <text
      x="745"
      y="529"
      class="detail"
      text-anchor="middle"
    >
      视频画面 + WebView 控件
    </text>
  </g>
  <g class="node note">
    <rect x="30" y="468" width="250" height="86" rx="12" />
    <text
      x="155"
      y="505"
      class="detail"
      text-anchor="middle"
    >
      浏览器解码属于
    </text>
    <text
      x="155"
      y="529"
      class="detail"
      text-anchor="middle"
    >
      另一条客户端通路。
    </text>
  </g>
  <g class="node note">
    <rect x="32" y="590" width="836" height="34" rx="12" />
    <text
      x="450"
      y="613"
      class="detail"
      text-anchor="middle"
    >
      完整帧的归属保留到 GPU 消费者使用结束。
    </text>
  </g>
</svg>
