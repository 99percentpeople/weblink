<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 844"
  lang="en"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">
    From a file offer to verified content
  </title>
  <desc id="desc">
    The receiver requests missing logical chunks. The sender
    compresses a chunk and splits it into binary packets.
    The receiver reconstructs and inflates it, storage
    commits bytes and checkpoints, and recovery requests
    only missing chunks. Whole-content verification precedes
    publication.
  </desc>
  <defs>
    <marker
      id="control-arrow"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="5"
      orient="auto-start-reverse"
    >
      <path
        d="M2 1L8 5L2 9"
        fill="none"
        stroke="var(--signal)"
        stroke-width="1.5"
      />
    </marker>
    <marker
      id="data-arrow"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="5"
      orient="auto-start-reverse"
    >
      <path
        d="M2 1L8 5L2 9"
        fill="none"
        stroke="var(--content)"
        stroke-width="1.5"
      />
    </marker>
    <marker
      id="retry-arrow"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="5"
      orient="auto-start-reverse"
    >
      <path
        d="M2 1L8 5L2 9"
        fill="none"
        stroke="var(--signal)"
        stroke-width="1.5"
      />
    </marker>
    <style>
      :root {
        --canvas: #f8fafc;
        --frame: #dbe3ed;
        --node: #ffffff;
        --border: #cbd5e1;
        --text: #1e293b;
        --muted: #475569;
        --signal: #64748b;
        --content: #315fa8;
        --accent-bg: #edf3fc;
        --accent-border: #a7bfdf;
        --success-bg: #edf7f1;
        --success-border: #a5cdb6;
        --warning-bg: #fff7e8;
        --warning-border: #d6b879;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #151a23;
          --frame: #374151;
          --node: #20252e;
          --border: #465368;
          --text: #e9edf5;
          --muted: #b2bed0;
          --signal: #94a3b8;
          --content: #96b9ff;
          --accent-bg: #24344b;
          --accent-border: #4d6793;
          --success-bg: #213b30;
          --success-border: #4c8062;
          --warning-bg: #3b3020;
          --warning-border: #8e7444;
        }
      }
      text {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          "Microsoft YaHei",
          sans-serif;
        fill: var(--text);
      }
      .title {
        font-size: 22px;
        font-weight: 650;
      }
      .node-title {
        font-size: 18px;
        font-weight: 600;
      }
      .detail {
        font-size: 16px;
        fill: var(--muted);
      }
      .label {
        font-size: 16px;
        paint-order: stroke;
        stroke: var(--canvas);
        stroke-width: 5px;
        stroke-linejoin: round;
      }
      .section {
        font-size: 17px;
        font-weight: 600;
      }
      .canvas {
        fill: var(--canvas);
        stroke: var(--frame);
      }
      .panel {
        fill: none;
        stroke: var(--frame);
      }
      .node rect,
      .node path {
        fill: var(--node);
        stroke: var(--border);
        stroke-width: 1.5;
      }
      .accent rect,
      .decision path {
        fill: var(--accent-bg);
        stroke: var(--accent-border);
      }
      .success rect {
        fill: var(--success-bg);
        stroke: var(--success-border);
      }
      .warning rect {
        fill: var(--warning-bg);
        stroke: var(--warning-border);
      }
      .note rect {
        fill: none;
        stroke: var(--frame);
      }
      .edge {
        fill: none;
        stroke-width: 2;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .control {
        stroke: var(--signal);
      }
      .data {
        stroke: var(--content);
        stroke-width: 2.5;
      }
      .retry {
        stroke: var(--signal);
        stroke-dasharray: 6 5;
      }
      .lifeline {
        fill: none;
        stroke: var(--frame);
        stroke-width: 1.5;
        stroke-dasharray: 5 6;
      }
    </style>
  </defs>
  <rect
    class="canvas"
    x="1"
    y="1"
    width="898"
    height="842"
    rx="16"
  />
  <text x="32" y="39" class="title" text-anchor="start">
    From a file offer to verified content
  </text>
  <path class="lifeline" d="M155 134V738" />
  <path class="lifeline" d="M450 134V738" />
  <path class="lifeline" d="M745 134V692" />
  <g class="node">
    <rect x="30" y="68" width="250" height="66" rx="12" />
    <text
      x="155"
      y="95"
      class="node-title"
      text-anchor="middle"
    >
      Sender
    </text>
    <text
      x="155"
      y="119"
      class="detail"
      text-anchor="middle"
    >
      Verified source content
    </text>
  </g>
  <g class="node">
    <rect x="325" y="68" width="250" height="66" rx="12" />
    <text
      x="450"
      y="95"
      class="node-title"
      text-anchor="middle"
    >
      Receiver
    </text>
    <text
      x="450"
      y="119"
      class="detail"
      text-anchor="middle"
    >
      Transfer session
    </text>
  </g>
  <g class="node">
    <rect x="620" y="68" width="250" height="66" rx="12" />
    <text
      x="745"
      y="95"
      class="node-title"
      text-anchor="middle"
    >
      Storage
    </text>
    <text
      x="745"
      y="119"
      class="detail"
      text-anchor="middle"
    >
      ChunkCache
    </text>
  </g>
  <path
    class="edge control"
    d="M155 178L450 178"
    marker-end="url(#control-arrow)"
  />
  <text
    x="302.5"
    y="166"
    class="label"
    text-anchor="middle"
  >
    Offer · metadata + fingerprint
  </text>
  <path
    class="edge control"
    d="M450 226L155 226"
    marker-end="url(#control-arrow)"
  />
  <text
    x="302.5"
    y="214"
    class="label"
    text-anchor="middle"
  >
    request-content · ranges
  </text>
  <g class="node accent">
    <rect x="30" y="255" width="250" height="88" rx="12" />
    <text
      x="155"
      y="293"
      class="node-title"
      text-anchor="middle"
    >
      Read a logical chunk
    </text>
    <text
      x="155"
      y="317"
      class="detail"
      text-anchor="middle"
    >
      Raw DEFLATE → blocks
    </text>
  </g>
  <path
    class="edge data"
    d="M155 389L450 389"
    marker-end="url(#data-arrow)"
  />
  <text
    x="302.5"
    y="377"
    class="label"
    text-anchor="middle"
  >
    7-byte header + block payload
  </text>
  <g class="node accent">
    <rect x="325" y="416" width="250" height="88" rx="12" />
    <text
      x="450"
      y="454"
      class="node-title"
      text-anchor="middle"
    >
      Reassemble + inflate
    </text>
    <text
      x="450"
      y="478"
      class="detail"
      text-anchor="middle"
    >
      Restore original bytes
    </text>
  </g>
  <path
    class="edge data"
    d="M450 548L745 548"
    marker-end="url(#data-arrow)"
  />
  <text
    x="597.5"
    y="536"
    class="label"
    text-anchor="middle"
  >
    Commit chunk bytes
  </text>
  <g class="node success">
    <rect x="620" y="576" width="250" height="84" rx="12" />
    <text
      x="745"
      y="612"
      class="node-title"
      text-anchor="middle"
    >
      Then commit checkpoint
    </text>
    <text
      x="745"
      y="636"
      class="detail"
      text-anchor="middle"
    >
      Chunk index + digest
    </text>
  </g>
  <path
    class="edge retry"
    d="M745 702L450 702"
    marker-end="url(#retry-arrow)"
  />
  <text
    x="597.5"
    y="690"
    class="label"
    text-anchor="middle"
  >
    Resume: verified checkpoints
  </text>
  <path
    class="edge retry"
    d="M450 746L155 746"
    marker-end="url(#retry-arrow)"
  />
  <text
    x="302.5"
    y="734"
    class="label"
    text-anchor="middle"
  >
    request-content · missing only
  </text>
  <g class="node note">
    <rect x="32" y="774" width="836" height="46" rx="12" />
    <text
      x="450"
      y="803"
      class="detail"
      text-anchor="middle"
    >
      All chunks committed → verify full content → publish
      the complete file.
    </text>
  </g>
</svg>
