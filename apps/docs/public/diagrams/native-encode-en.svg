    class="edge data"
    d="M280 131L325 131"
    marker-end="url(#data-arrow)"
  />
  <path
    class="edge data"
    d="M575 131L620 131"
    marker-end="url(#data-arrow)"
  />
  <path
    class="edge data"
    d="M155 174L155 402"
    marker-end="url(#data-arrow)"
  />
  <path
    class="edge retry"
    d="M155 224H450V270"
    marker-end="url(#retry-arrow)"
  />
  <path
    class="edge control"
    d="M745 174L745 270"
    marker-end="url(#control-arrow)"
  />
  <path
    class="edge control"
    d="M745 358L745 402"
    marker-end="url(#control-arrow)"
  />
  <path
    class="edge retry"
    d="M450 358L450 402"
    marker-end="url(#retry-arrow)"
  />
  <path
    class="edge control"
    d="M575 446H596V314H620"
    marker-end="url(#control-arrow)"
  />
  <g class="node accent">
    <rect x="30" y="88" width="250" height="86" rx="12" />
    <text
      x="155"
      y="125"
      class="node-title"
      text-anchor="middle"
    >
      Native capture
    </text>
    <text
      x="155"
      y="149"
      class="detail"
      text-anchor="middle"
    >
      WGC / DXGI · BGRA
    </text>
  </g>
  <g class="node accent">
    <rect x="325" y="88" width="250" height="86" rx="12" />
    <text
      x="450"
      y="113"
      class="node-title"
      text-anchor="middle"
    >
      GPU preparation
    </text>
    <text
      x="450"
      y="137"
      class="detail"
      text-anchor="middle"
    >
      Scale / rotate / cursor
    </text>
    <text
      x="450"
      y="161"
      class="detail"
      text-anchor="middle"
    >
      BGRA → NV12
    </text>
  </g>
  <g class="node accent">
    <rect x="620" y="88" width="250" height="86" rx="12" />
    <text
      x="745"
      y="113"
      class="node-title"
      text-anchor="middle"
    >
      Hardware encoder
    </text>
    <text
      x="745"
      y="137"
      class="detail"
      text-anchor="middle"
    >
      NVENC / Media Foundation
    </text>
    <text
      x="745"
      y="161"
      class="detail"
      text-anchor="middle"
    >
      H.264 / H.265
    </text>
  </g>
  <text x="450" y="253" class="label" text-anchor="middle">
    Only when required
  </text>
  <g class="node warning">
    <rect x="325" y="270" width="250" height="88" rx="12" />
    <text
      x="450"
      y="308"
      class="node-title"
      text-anchor="middle"
    >
      CPU readback
    </text>
    <text
      x="450"
      y="332"
      class="detail"
      text-anchor="middle"
    >
      Raw pixel memory
    </text>
  </g>
  <g class="node">
    <rect x="620" y="270" width="250" height="88" rx="12" />
    <text
      x="745"
      y="308"
      class="node-title"
      text-anchor="middle"
    >
      Compressed output
    </text>
    <text
      x="745"
      y="332"
      class="detail"
      text-anchor="middle"
    >
      Bitstream in CPU memory
    </text>
  </g>
  <g class="node accent">
    <rect x="30" y="402" width="250" height="88" rx="12" />
    <text
      x="155"
      y="440"
      class="node-title"
      text-anchor="middle"
    >
      Shared GPU presenter
    </text>
    <text
      x="155"
      y="464"
      class="detail"
      text-anchor="middle"
    >
      Local capture preview
    </text>
  </g>
  <g class="node">
    <rect x="325" y="402" width="250" height="88" rx="12" />
    <text
      x="450"
      y="440"
      class="node-title"
      text-anchor="middle"
    >
      Encode from memory
    </text>
    <text
      x="450"
      y="464"
      class="detail"
      text-anchor="middle"
    >
      Native software / hardware
    </text>
  </g>
  <g class="node">
    <rect x="620" y="402" width="250" height="88" rx="12" />
    <text
      x="745"
      y="440"
      class="node-title"
      text-anchor="middle"
    >
      Native WebRTC
    </text>
    <text
      x="745"
      y="464"
      class="detail"
      text-anchor="middle"
    >
      RTP → remote device
    </text>
  </g>
  <g class="node note">
    <rect x="32" y="535" width="836" height="58" rx="12" />
    <text
      x="450"
      y="558"
      class="detail"
      text-anchor="middle"
    >
      GPU texture input avoids a full raw-frame round trip
      through CPU memory.
    </text>
    <text
      x="450"
      y="582"
