  />
  <path
    class="edge data"
    d="M575 139L620 139"
    marker-end="url(#data-arrow)"
  />
  <path
    class="edge data"
    d="M280 285H596V139H620"
    marker-end="url(#data-arrow)"
  />
  <path
    class="edge control"
    d="M745 182L745 242"
    marker-end="url(#control-arrow)"
  />
  <g class="node">
    <rect x="30" y="96" width="250" height="86" rx="12" />
    <text
      x="155"
      y="133"
      class="node-title"
      text-anchor="middle"
    >
      Microphone
    </text>
    <text
      x="155"
      y="157"
