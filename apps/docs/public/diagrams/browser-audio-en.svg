    </text>
  </g>
  <g class="node">
    <rect x="325" y="96" width="250" height="86" rx="12" />
    <text
      x="450"
      y="121"
      class="node-title"
      text-anchor="middle"
    >
      Input processing
    </text>
    <text
      x="450"
      y="145"
      class="detail"
      text-anchor="middle"
    >
      Echo / noise / gain
    </text>
    <text
      x="450"
      y="169"
      class="detail"
      text-anchor="middle"
    >
      When supported
    </text>
  </g>
  <g class="node accent">
    <rect x="620" y="96" width="250" height="86" rx="12" />
    <text
      x="745"
      y="133"
      class="node-title"
      text-anchor="middle"
    >
      Browser encoder
    </text>
    <text
      x="745"
      y="157"
      class="detail"
      text-anchor="middle"
    >
      Opus / G.722 / G.711
    </text>
  </g>
  <g class="node">
    <rect x="30" y="242" width="250" height="86" rx="12" />
    <text
      x="155"
      y="267"
      class="node-title"
      text-anchor="middle"
    >
      Screen audio
    </text>
    <text
      x="155"
      y="291"
      class="detail"
      text-anchor="middle"
    >
      getDisplayMedia()
    </text>
    <text
      x="155"
      y="315"
      class="detail"
      text-anchor="middle"
    >
      Only if an audio track exists
    </text>
  </g>
  <g class="node">
    <rect x="620" y="242" width="250" height="86" rx="12" />
    <text
      x="745"
      y="279"
      class="node-title"
      text-anchor="middle"
    >
      Send to peer
    </text>
    <text
      x="745"
      y="303"
      class="detail"
      text-anchor="middle"
    >
      RTP / SRTP
    </text>
  </g>
  <g class="node note">
    <rect x="32" y="354" width="836" height="56" rx="12" />
    <text
      x="450"
      y="376"
      class="detail"
      text-anchor="middle"
    >
      Sampling preferences are not a guarantee of the
      returned capture format.
    </text>
    <text
      x="450"
      y="400"
      class="detail"
      text-anchor="middle"
    >
      The normal Web call needs no application PCM bridge.
    </text>
  </g>
  <text x="32" y="448" class="section" text-anchor="start">
    Receiving · decode before playback
  </text>
  <path
    class="edge control"
    d="M280 511L325 511"
    marker-end="url(#control-arrow)"
  />
  <path
    class="edge data"
    d="M575 511L620 511"
    marker-end="url(#data-arrow)"
  />
  <path
    class="edge data"
    d="M745 554L745 598"
    marker-end="url(#data-arrow)"
  />
  <g class="node">
    <rect x="30" y="468" width="250" height="86" rx="12" />
    <text
      x="155"
      y="505"
      class="node-title"
      text-anchor="middle"
    >
      Receive + buffer
    </text>
    <text
      x="155"
      y="529"
      class="detail"
      text-anchor="middle"
    >
      RTP · timing / loss
    </text>
  </g>
  <g class="node accent">
    <rect x="325" y="468" width="250" height="86" rx="12" />
    <text
      x="450"
      y="505"
      class="node-title"
      text-anchor="middle"
    >
      Browser decoder
    </text>
    <text
      x="450"
      y="529"
      class="detail"
      text-anchor="middle"
    >
      Encoded audio → samples
    </text>
  </g>
  <g class="node">
    <rect x="620" y="468" width="250" height="86" rx="12" />
    <text
      x="745"
      y="505"
      class="node-title"
      text-anchor="middle"
    >
      Shared &lt;audio&gt;
    </text>
    <text
      x="745"
      y="529"
      class="detail"
      text-anchor="middle"
    >
      Received MediaStream
    </text>
  </g>
  <g class="node">
    <rect x="620" y="598" width="250" height="86" rx="12" />
    <text
      x="745"
      y="635"
      class="node-title"
      text-anchor="middle"
    >
      Output device
    </text>
    <text
      x="745"
      y="659"
      class="detail"
      text-anchor="middle"
    >
      Headphones / speakers
    </text>
  </g>
  <g class="node note">
    <rect x="32" y="598" width="542" height="86" rx="12" />
    <text
      x="303"
      y="623"
      class="detail"
      text-anchor="middle"
    >
      Source mute, listening state, and output selection
    </text>
    <text
      x="303"
      y="647"
      class="detail"
      text-anchor="middle"
    >
      act locally; they do not stop remote capture.
    </text>
    <text
      x="303"
      y="671"
      class="detail"
      text-anchor="middle"
    >
      Playback must be permitted by the browser.
    </text>
  </g>
</svg>
