<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1192 352" lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">从开始采集到屏幕显示的时间点</title>
  <desc id="desc">一帧依次经过采集开始、采集帧 C、封包前回调 P、传输提交 T、末包收齐 R、解码完成 D、提交合成 S 和屏幕显示。端到端统计 C 到 S，接收与呈现延迟在 R 相接。X 为浏览器预计显示时刻。</desc>
  <style>
    :root { color-scheme:light dark; --ink:#24292f; --muted:#57606a; --line:#aeb7c2; --first:#a96717; --first-bg:#fcf1df; --second:#2475ab; --second-bg:#e7f2fa; --display:#f1f3f5; }
    @media (prefers-color-scheme:dark) { :root { --ink:#e6edf3; --muted:#aeb9c5; --line:#667585; --first:#eab66b; --first-bg:#392c1b; --second:#79c0ff; --second-bg:#193247; --display:#252c34; } }
    text { font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif; font-size:17px; fill:var(--ink); }
    .label { font-size:20px; font-weight:600; }
    .code { font-size:16px; font-weight:600; }
    .detail { font-size:15px; }
    .muted { fill:var(--muted); }
  </style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="var(--line)" stroke-width="1.5"/></marker></defs>
  <text class="label" x="556" y="30" text-anchor="middle">端到端 C → S</text>
  <path d="M168 58V46H944V58" fill="none" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="40" y="70" width="128" height="50" fill="var(--display)"/>
  <rect x="168" y="70" width="480" height="50" fill="var(--first-bg)"/>
  <rect x="648" y="70" width="296" height="50" fill="var(--second-bg)"/>
  <rect x="944" y="70" width="208" height="50" fill="var(--display)"/>
  <rect x="168" y="116" width="480" height="4" fill="var(--first)"/>
  <rect x="648" y="116" width="296" height="4" fill="var(--second)"/>
  <text class="muted" x="104" y="101" text-anchor="middle">来源采集</text>
  <text class="label" x="408" y="101" text-anchor="middle">接收延迟</text>
  <text class="label" x="796" y="101" text-anchor="middle">呈现延迟</text>
  <text class="muted" x="1048" y="101" text-anchor="middle">显示阶段</text>
  <line x1="40" y1="172" x2="168" y2="172" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="168" y1="172" x2="648" y2="172" stroke="var(--first)" stroke-width="2"/>
  <line x1="648" y1="172" x2="944" y2="172" stroke="var(--second)" stroke-width="2"/>
  <line x1="944" y1="172" x2="1152" y2="172" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <circle cx="40" cy="172" r="4" fill="var(--muted)"/>
  <text x="40" y="208" text-anchor="start">开始采集</text>
  <text class="code" x="168" y="152" text-anchor="middle">C</text>
  <circle cx="168" cy="172" r="6" fill="var(--first)"/>
  <text x="168" y="208" text-anchor="middle">采集帧</text>
  <text class="code" x="328" y="152" text-anchor="middle">P</text>
  <circle cx="328" cy="172" r="4" fill="var(--first)"/>
  <text x="328" y="208" text-anchor="middle">封包前回调</text>
  <text class="code" x="488" y="152" text-anchor="middle">T</text>
  <circle cx="488" cy="172" r="4" fill="var(--first)"/>
  <text x="488" y="208" text-anchor="middle">传输提交</text>
  <text class="code" x="648" y="152" text-anchor="middle">R</text>
  <circle cx="648" cy="172" r="6" fill="var(--ink)"/>
  <text x="648" y="208" text-anchor="middle">末包收齐</text>
  <text class="code" x="796" y="152" text-anchor="middle">D</text>
  <circle cx="796" cy="172" r="4" fill="var(--second)"/>
  <text x="796" y="208" text-anchor="middle">解码完成</text>
  <text class="code" x="944" y="152" text-anchor="middle">S</text>
  <circle cx="944" cy="172" r="6" fill="var(--second)"/>
  <text x="944" y="208" text-anchor="middle">提交合成</text>
  <text class="code muted" x="1152" y="152" text-anchor="middle">X</text>
  <text x="1152" y="208" text-anchor="end">屏幕显示</text>
  <text class="detail muted" x="1152" y="230" text-anchor="end">预计时刻</text>
  <path d="M168 266V276H488V266" fill="none" stroke="var(--first)" stroke-width="1.5"/>
  <text class="detail" x="328" y="311" text-anchor="middle">发送延迟 C → T</text>
  <path d="M796 266V276H944V266" fill="none" stroke="var(--second)" stroke-width="1.5"/>
  <text class="detail" x="870" y="311" text-anchor="middle">解码后 D → S</text>
  <path d="M944 266V276H1152V266" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text class="detail muted" x="1048" y="311" text-anchor="middle">显示等待 S → X</text>
</svg>
