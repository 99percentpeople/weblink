<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 900"
  lang="en"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">
    Windows audio: native codecs and PCM bridges
  </title>
  <desc id="desc">
    System audio enters native encoding from WASAPI process
    loopback, excluding Weblink. A microphone attached to
    the native room instead crosses a WebView AudioWorklet
    PCM bridge. Native reception decodes to bounded PCM,
    crosses IPC, and reaches a playback worklet, MediaStream
    destination, shared audio element, and device output.
  </desc>
