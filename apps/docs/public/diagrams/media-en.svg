<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 676"
  lang="en"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">
    Media delivery and recording paths
  </title>
  <desc id="desc">
    Capture feeds encoding and WebRTC, then the receiver
    decodes and presents media. Recording uses either the
    browser recorder or an encoded-packet muxer according to
    the actual source. Both write through bounded storage,
    then finalize the output on stop.
  </desc>
  <defs>
    <marker
      id="control-arrow"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="5"
      orient="auto-start-reverse"
    >
      <path
        d="M2 1L8 5L2 9"
        fill="none"
        stroke="var(--signal)"
        stroke-width="1.5"
      />
    </marker>
    <marker
      id="data-arrow"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="5"
      orient="auto-start-reverse"
    >
      <path
        d="M2 1L8 5L2 9"
        fill="none"
        stroke="var(--content)"
        stroke-width="1.5"
      />
    </marker>
    <marker
      id="retry-arrow"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="5"
      orient="auto-start-reverse"
    >
      <path
        d="M2 1L8 5L2 9"
        fill="none"
        stroke="var(--signal)"
        stroke-width="1.5"
      />
    </marker>
    <style>
      :root {
        --canvas: #f8fafc;
        --frame: #dbe3ed;
        --node: #ffffff;
        --border: #cbd5e1;
        --text: #1e293b;
        --muted: #475569;
        --signal: #64748b;
        --content: #315fa8;
        --accent-bg: #edf3fc;
        --accent-border: #a7bfdf;
        --success-bg: #edf7f1;
        --success-border: #a5cdb6;
        --warning-bg: #fff7e8;
        --warning-border: #d6b879;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #151a23;
          --frame: #374151;
          --node: #20252e;
          --border: #465368;
          --text: #e9edf5;
          --muted: #b2bed0;
          --signal: #94a3b8;
          --content: #96b9ff;
          --accent-bg: #24344b;
          --accent-border: #4d6793;
          --success-bg: #213b30;
          --success-border: #4c8062;
          --warning-bg: #3b3020;
          --warning-border: #8e7444;
        }
      }
      text {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          "Microsoft YaHei",
          sans-serif;
        fill: var(--text);
      }
      .title {
        font-size: 22px;
        font-weight: 650;
      }
      .node-title {
        font-size: 18px;
        font-weight: 600;
      }
      .detail {
        font-size: 16px;
        fill: var(--muted);
      }
      .label {
        font-size: 16px;
        paint-order: stroke;
        stroke: var(--canvas);
        stroke-width: 5px;
        stroke-linejoin: round;
      }
      .section {
        font-size: 17px;
        font-weight: 600;
      }
      .canvas {
        fill: var(--canvas);
        stroke: var(--frame);
      }
      .panel {
        fill: none;
        stroke: var(--frame);
      }
      .node rect,
      .node path {
        fill: var(--node);
        stroke: var(--border);
        stroke-width: 1.5;
      }
      .accent rect,
      .decision path {
        fill: var(--accent-bg);
        stroke: var(--accent-border);
      }
      .success rect {
        fill: var(--success-bg);
        stroke: var(--success-border);
      }
      .warning rect {
        fill: var(--warning-bg);
        stroke: var(--warning-border);
      }
      .note rect {
        fill: none;
        stroke: var(--frame);
      }
      .edge {
        fill: none;
        stroke-width: 2;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .control {
        stroke: var(--signal);
      }
      .data {
        stroke: var(--content);
        stroke-width: 2.5;
      }
      .retry {
        stroke: var(--signal);
        stroke-dasharray: 6 5;
      }
      .lifeline {
        fill: none;
        stroke: var(--frame);
        stroke-width: 1.5;
        stroke-dasharray: 5 6;
      }
    </style>
  </defs>
  <rect
    class="canvas"
    x="1"
    y="1"
    width="898"
    height="674"
    rx="16"
  />
  <text x="32" y="39" class="title" text-anchor="start">
    Media delivery and recording paths
  </text>
  <path
    class="edge data"
    d="M280 140L325 140"
    marker-end="url(#data-arrow)"
  />
  <path
    class="edge data"
    d="M575 140L620 140"
    marker-end="url(#data-arrow)"
  />
  <path
    class="edge control"
    d="M155 184L155 284"
    marker-end="url(#control-arrow)"
  />
  <path
    class="edge control"
    d="M450 184L450 284"
    marker-end="url(#control-arrow)"
  />
  <path
    class="edge data"
    d="M155 372V416H450V456"
    marker-end="url(#data-arrow)"
  />
  <path
    class="edge data"
    d="M450 372V456"
    marker-end="url(#data-arrow)"
  />
  <path
    class="edge data"
    d="M575 498L620 498"
    marker-end="url(#data-arrow)"
  />
  <g class="node">
    <rect x="30" y="96" width="250" height="88" rx="12" />
    <text
      x="155"
      y="134"
      class="node-title"
      text-anchor="middle"
    >
      Capture
    </text>
    <text
      x="155"
      y="158"
      class="detail"
      text-anchor="middle"
    >
      Camera / mic / screen
    </text>
  </g>
  <g class="node accent">
    <rect x="325" y="96" width="250" height="88" rx="12" />
    <text
      x="450"
      y="134"
      class="node-title"
      text-anchor="middle"
    >
      Encode + WebRTC
    </text>
    <text
      x="450"
      y="158"
      class="detail"
      text-anchor="middle"
    >
      RTP · direct or TURN
    </text>
  </g>
  <g class="node">
    <rect x="620" y="96" width="250" height="88" rx="12" />
    <text
      x="745"
      y="134"
      class="node-title"
      text-anchor="middle"
    >
      Decode + present
    </text>
    <text
      x="745"
      y="158"
      class="detail"
      text-anchor="middle"
    >
      Compatible receiver
    </text>
  </g>
  <text x="155" y="248" class="label" text-anchor="middle">
    Browser API path
  </text>
  <text x="450" y="248" class="label" text-anchor="middle">
    Encoded packets available
  </text>
  <g class="node">
    <rect x="30" y="284" width="250" height="88" rx="12" />
    <text
      x="155"
      y="322"
      class="node-title"
      text-anchor="middle"
    >
      Browser recorder
    </text>
    <text
      x="155"
      y="346"
      class="detail"
      text-anchor="middle"
    >
      MediaRecorder
    </text>
  </g>
  <g class="node accent">
    <rect x="325" y="284" width="250" height="88" rx="12" />
    <text
      x="450"
      y="322"
      class="node-title"
      text-anchor="middle"
    >
      Encoded recorder
    </text>
    <text
      x="450"
      y="346"
      class="detail"
      text-anchor="middle"
    >
      Mux the original codecs
    </text>
  </g>
  <g class="node note">
    <rect x="620" y="284" width="250" height="88" rx="12" />
    <text
      x="745"
      y="322"
      class="detail"
      text-anchor="middle"
    >
      Muxing is not transcoding.
    </text>
    <text
      x="745"
      y="346"
      class="detail"
      text-anchor="middle"
    >
      Container follows codecs.
    </text>
  </g>
  <g class="node">
    <rect x="325" y="456" width="250" height="84" rx="12" />
    <text
      x="450"
      y="492"
      class="node-title"
      text-anchor="middle"
    >
      Bounded VFS writes
    </text>
    <text
      x="450"
      y="516"
      class="detail"
      text-anchor="middle"
    >
      Keep the original mount
    </text>
  </g>
  <g class="node success">
    <rect x="620" y="456" width="250" height="84" rx="12" />
    <text
      x="745"
      y="492"
      class="node-title"
      text-anchor="middle"
    >
      Stop → finalize
    </text>
    <text
      x="745"
      y="516"
      class="detail"
      text-anchor="middle"
    >
      Publish the saved file
    </text>
  </g>
  <g class="node note">
    <rect x="32" y="584" width="836" height="66" rx="12" />
    <text
      x="450"
      y="611"
      class="detail"
      text-anchor="middle"
    >
      One recording follows one video source and its
      associated audio.
    </text>
    <text
      x="450"
      y="635"
      class="detail"
      text-anchor="middle"
    >
      The browser and encoded-packet engines are alternative
      recording paths.
    </text>
  </g>
</svg>
