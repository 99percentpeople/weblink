      class="detail"
      text-anchor="middle"
    >
      Weblink sets format and quality; the browser selects
      the implementation.
    </text>
  </g>
  <text x="32" y="451" class="section" text-anchor="start">
    Receiving · decode, then display
  </text>
  <path
