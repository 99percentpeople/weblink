name: Web development

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy development site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Preview
      url: https://dev.webl.ink
    env:
      PAGES_PROJECT_NAME: weblink
      VITE_WEBSOCKET_URL: ${{ vars.VITE_WEBSOCKET_URL }}
      WEBLINK_STUN_SERVERS: ${{ vars.WEBLINK_STUN_SERVERS }}
      VITE_TURN_SERVERS: ${{ secrets.VITE_TURN_SERVERS }}

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node for Wrangler
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build development channel
        run: |
          bun apps/web/scripts/check-build-env.ts dev
          bun run build:dev

      - name: Deploy dev preview, never production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bunx wrangler@4.137.0 pages deploy apps/web/dist \
            --project-name "$PAGES_PROJECT_NAME" \
            --branch dev \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Dev $GITHUB_SHA"

      - name: Verify development domain
        run: |
          bun -e '
            const expected = process.env.GITHUB_SHA;
            for (let attempt = 1; attempt <= 12; attempt++) {
              try {
                const response = await fetch(`https://dev.webl.ink/version.json?commit=${expected}`, {
                  cache: "no-store",
                  signal: AbortSignal.timeout(10000),
                });
                if (response.ok) {
                  const info = await response.json();
                  if (info.channel === "dev" && info.commit === expected) {
                    console.log(`Verified ${info.version} (${info.commit})`);
                    process.exit(0);
                  }
                }
              } catch {}
              if (attempt < 12) await Bun.sleep(5000);
            }
            throw new Error(`dev.webl.ink does not serve dev commit ${expected}`);
          '

      - name: Summarize development deployment
        run: |
          printf '### Weblink Dev\n\nCommit: `%s`\n\nSite: https://dev.webl.ink\n' \
            "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
