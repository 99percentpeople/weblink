name: Desktop production

on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: Windows desktop
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-production-release
      - run: bun install --frozen-lockfile
      # Shared TypeScript checks and tests already passed in the caller's Checks job.
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked --release
      - name: Build Windows installer
        run: bun run build:desktop --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: weblink-windows-x64-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
