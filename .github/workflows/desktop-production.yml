name: Desktop production

on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: Windows desktop
    runs-on: windows-latest
    timeout-minutes: 35
    environment: production
    env:
      WEBLINK_BUILD_CHANNEL: stable
      WEBLINK_UPDATER_PUBLIC_KEY: ${{ vars.WEBLINK_UPDATER_PUBLIC_KEY }}
      VITE_SHARE_URL: ${{ vars.VITE_SHARE_URL || 'https://webl.ink' }}
      VITE_WEBSOCKET_URL: ${{ vars.VITE_WEBSOCKET_URL }}
      WEBLINK_STUN_SERVERS: ${{ vars.WEBLINK_STUN_SERVERS }}
      VITE_TURN_SERVERS: ${{ secrets.VITE_TURN_SERVERS }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-production-release
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - name: Verify desktop build configuration
        run: bun apps/web/scripts/check-build-env.ts desktop
      - name: Prepare signed updater configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bun scripts/desktop-updater.mjs config .tmp/tauri-updater.conf.json
      # PR/public CI owns TypeScript/native tests and formatting. Release builds
      # compile only the shipping executable, avoiding the full-LTO test binaries.
      - name: Build desktop frontend
        run: bun run --cwd apps/web build:desktop
      - name: Build Windows executable and installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: bun run build:desktop --bundles nsis --config "$((Resolve-Path .tmp/tauri-updater.conf.json).Path)"
      - name: Prepare installer release asset
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path target/release/bundle/nsis -Filter *.exe -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows NSIS installer."
          }
          $signature = $installers[0].FullName + '.sig'
          if (!(Test-Path -LiteralPath $signature -PathType Leaf)) {
            throw "Missing updater signature for the NSIS installer."
          }
          Rename-Item -LiteralPath $installers[0].FullName -NewName Weblink-windows-x64-setup.exe
          Rename-Item -LiteralPath $signature -NewName Weblink-windows-x64-setup.exe.sig
      - name: Package portable Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target/release/bundle/portable -Force | Out-Null
          New-Item -ItemType File -Path target/release/weblink-portable -Force | Out-Null
          Compress-Archive -LiteralPath target/release/weblink-desktop.exe,target/release/weblink-portable -DestinationPath target/release/bundle/portable/Weblink-windows-x64-portable.zip -Force
      - name: Generate release notes with download links
        shell: pwsh
        run: bun scripts/generate-release-notes.mjs "$env:GITHUB_REF_NAME" target/release/release-notes.md
      - name: Generate updater manifest
        shell: pwsh
        run: bun scripts/desktop-updater.mjs manifest "$env:GITHUB_REF_NAME" target/release/bundle/nsis/Weblink-windows-x64-setup.exe.sig target/release/release-notes.md target/release/latest.json
      - uses: actions/upload-artifact@v7
        with:
          name: weblink-windows-x64-installer
          path: |
            target/release/bundle/nsis/Weblink-windows-x64-setup.exe
            target/release/bundle/nsis/Weblink-windows-x64-setup.exe.sig
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: weblink-updater-manifest
          path: target/release/latest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: weblink-windows-x64-portable
          path: target/release/bundle/portable/Weblink-windows-x64-portable.zip
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: weblink-release-notes
          path: target/release/release-notes.md
          if-no-files-found: error
