name: Desktop production

on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: Windows desktop
    runs-on: windows-latest
    timeout-minutes: 35
    environment: production
    env:
      VITE_SHARE_URL: ${{ vars.VITE_SHARE_URL || 'https://webl.ink' }}
      VITE_WEBSOCKET_URL: ${{ vars.VITE_WEBSOCKET_URL }}
      WEBLINK_STUN_SERVERS: ${{ vars.WEBLINK_STUN_SERVERS }}
      VITE_TURN_SERVERS: ${{ secrets.VITE_TURN_SERVERS }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-production-release
      - run: bun install --frozen-lockfile
      - name: Verify desktop build configuration
        run: bun apps/web/scripts/check-build-env.ts desktop
      # Shared TypeScript checks and tests already passed in the caller's Checks job.
      - run: cargo fmt --all --check
      # Production-mode tests embed the frontend and use the CLI's Cargo features.
      - name: Build desktop frontend
        run: bun run --cwd apps/web build:desktop
      - run: cargo test --workspace --locked --release --features tauri/custom-protocol
      - name: Build Windows installer
        run: bun run build:desktop --bundles nsis --config src-tauri/tauri.ci.conf.json
      - uses: actions/upload-artifact@v7
        with:
          name: weblink-windows-x64-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
