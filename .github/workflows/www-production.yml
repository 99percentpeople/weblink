name: Marketing production

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy www.webl.ink
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://www.webl.ink
    concurrency:
      group: cloudflare-pages-www-production
      cancel-in-progress: false
    env:
      PAGES_PROJECT_NAME: weblink-www
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Build marketing website
        run: |
          bun run build:www
          bun -e '
            const { version } = await Bun.file("apps/web/package.json").json();
            await Bun.write("apps/www/dist/version.json", JSON.stringify({
              site: "www", version, commit: process.env.GITHUB_SHA,
              tag: process.env.GITHUB_REF_NAME
            }) + "\n");
          '
      - name: Deploy marketing release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bunx wrangler@4.137.0 pages deploy apps/www/dist \
            --project-name "$PAGES_PROJECT_NAME" \
            --branch public \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Release $GITHUB_REF_NAME"
      - name: Verify marketing domain
        run: |
          bun -e '
            const expected = process.env.GITHUB_SHA;
            for (let attempt = 1; attempt <= 12; attempt++) {
              try {
                const response = await fetch(`https://www.webl.ink/version.json?commit=${expected}`, {
                  cache: "no-store", signal: AbortSignal.timeout(10000)
                });
                if (response.ok) {
                  const info = await response.json();
                  if (info.site === "www" && info.commit === expected) {
                    console.log(`Verified www ${info.version} (${info.commit})`);
                    process.exit(0);
                  }
                }
              } catch {}
              if (attempt < 12) await Bun.sleep(5000);
            }
            throw new Error(`www.webl.ink does not serve ${expected}`);
          '
