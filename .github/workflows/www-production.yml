name: Marketing production

on:
  pull_request:
    paths:
      - "apps/www/**"
      - "!apps/www/README.md"
      - "!apps/www/.env.example"
      - "packages/theme/**"
      - "packages/locale/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "scripts/static-site.mjs"
      - "scripts/test/static-site.test.mjs"
      - ".github/workflows/www-production.yml"
  push:
    branches:
      - public
    paths:
      - "apps/www/**"
      - "!apps/www/README.md"
      - "!apps/www/.env.example"
      - "packages/theme/**"
      - "packages/locale/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "scripts/static-site.mjs"
      - "scripts/test/static-site.test.mjs"
      - ".github/workflows/www-production.yml"
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even if unchanged or not yet reachable (initial setup/recovery)
        type: boolean
        default: false

permissions:
  contents: read

# Serialize public builds through deployment so an older build cannot publish
# after a newer one. Superseded PR checks can be cancelled immediately.
concurrency:
  group: www-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check and build marketing website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_DOCS_URL: ${{ vars.VITE_DOCS_URL || 'https://docs.webl.ink' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: node --test scripts/test/static-site.test.mjs
      - name: Build marketing website
        run: |
          bun run build:www
          node scripts/static-site.mjs prepare www apps/www/dist
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: weblink-www
          path: apps/www/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy www.webl.ink
    needs: build
    if: >-
      github.repository == '99percentpeople/weblink' &&
      github.ref == 'refs/heads/public' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://www.webl.ink
    env:
      PAGES_PROJECT_NAME: weblink-www
      PAGES_URL: ${{ vars.WWW_PAGES_URL || 'https://weblink-www.pages.dev/' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: weblink-www
          path: apps/www/dist
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Compare published content
        id: changes
        env:
          FORCE_DEPLOY: ${{ inputs.force || false }}
        run: node scripts/static-site.mjs check www apps/www/dist "$PAGES_URL"
      - name: Deploy marketing website
        if: steps.changes.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler@4.137.0 pages deploy apps/www/dist \
            --project-name "$PAGES_PROJECT_NAME" \
            --branch public \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Update www $GITHUB_SHA"
      - name: Verify published content
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/static-site.mjs verify www apps/www/dist "$PAGES_URL"
