name: CI

on:
  pull_request:
  push:
    branches:
      - public
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Verify release version and notes
        if: github.ref_type == 'tag'
        run: |
          bun -e '
            const { version } = await Bun.file("package.json").json();
            const tag = process.env.GITHUB_REF_NAME;
            if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag ?? "") ||
                tag !== `v${version}`) {
              throw new Error("The release tag must match the stable version in package.json");
            }
            const notes = await Bun.file("CHANGELOG.md").text();
            if (!notes.includes(`## [${version}] - `)) {
              throw new Error("Add dated release notes to CHANGELOG.md before deploying");
            }
          '

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run lint

      - name: Run unit tests
        run: bun run test:unit

      - name: Run integration tests
        run: bun run test:integration

  deploy-dev:
    name: Deploy development site
    needs: checks
    if: >-
      github.repository == '99percentpeople/weblink' &&
      github.ref == 'refs/heads/public' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Preview
      url: https://dev.webl.ink
    env:
      PAGES_PROJECT_NAME: weblink
      # An account ID is public routing metadata, not an API credential.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'e002f14aaa5aa851c9def226a6005a40' }}

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node for Wrangler
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Verify isolated Pages preview target
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/pages-dev.mjs check

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build development channel
        env:
          PAGES_BUILD_ENV: ${{ secrets.PAGES_BUILD_ENV }}
        run: |
          if [[ -n "$PAGES_BUILD_ENV" ]]; then
            printf '%s\n' "$PAGES_BUILD_ENV" > .env.dev.local
          fi
          bun run build:dev

      - name: Deploy dev preview, never production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bunx wrangler@4.137.0 pages deploy dist \
            --project-name "$PAGES_PROJECT_NAME" \
            --branch dev \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Dev $GITHUB_SHA"

      - name: Verify Pages preview
        env:
          PAGES_DEV_ALIAS: ${{ steps.pages.outputs.alias }}
        run: node scripts/pages-dev.mjs verify "$PAGES_DEV_ALIAS"

      - name: Verify development domain
        run: node scripts/pages-dev.mjs verify dev.webl.ink

      - name: Summarize development deployment
        env:
          PAGES_DEV_ALIAS: ${{ steps.pages.outputs.alias }}
        run: |
          printf '### Weblink Dev\n\nCommit: `%s`\n\nSite: https://dev.webl.ink\n\nVerified preview: https://%s\n' \
            "$GITHUB_SHA" "$PAGES_DEV_ALIAS" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy production release
    needs: checks
    if: >-
      github.repository == '99percentpeople/weblink' &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    env:
      PAGES_PROJECT_NAME: weblink

    steps:
      - name: Check out tested release
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node for Wrangler
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Read existing Pages production branch
        id: pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bun -e '
            import { appendFileSync } from "node:fs";
            const { CLOUDFLARE_ACCOUNT_ID: account, CLOUDFLARE_API_TOKEN: token, PAGES_PROJECT_NAME: project } = process.env;
            if (!account || !token) {
              throw new Error("Configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in GitHub Actions secrets");
            }
            const url = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/pages/projects/${encodeURIComponent(project)}`;
            const response = await fetch(url, {
              headers: { Authorization: `Bearer ${token}` },
              signal: AbortSignal.timeout(20000),
            });
            if (!response.ok) throw new Error(`Pages project lookup failed (HTTP ${response.status})`);
            const data = await response.json();
            const branch = data.result?.production_branch;
            if (!data.success || typeof branch !== "string" || !branch || /[\r\n]/.test(branch)) {
              throw new Error("The existing Pages project must have a production branch");
            }
            appendFileSync(process.env.GITHUB_OUTPUT, `production_branch=${branch}\n`);
          '

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production bundle
        env:
          PAGES_BUILD_ENV: ${{ secrets.PAGES_BUILD_ENV }}
        run: |
          if [[ -z "$PAGES_BUILD_ENV" ]]; then
            echo "::error::Configure PAGES_BUILD_ENV with the production VITE_* settings."
            exit 1
          fi
          printf '%s\n' "$PAGES_BUILD_ENV" > .env.production.local
          bun run build

      - name: Deploy release to Pages production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_PRODUCTION_BRANCH: ${{ steps.pages.outputs.production_branch }}
        run: |
          bunx wrangler@4.137.0 pages deploy dist \
            --project-name "$PAGES_PROJECT_NAME" \
            --branch "$PAGES_PRODUCTION_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Release $GITHUB_REF_NAME"
