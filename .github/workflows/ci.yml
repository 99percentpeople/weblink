name: CI

on:
  pull_request:
  push:
    branches:
      - public
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Verify release version and notes
        if: github.ref_type == 'tag'
        run: |
          bun -e '
            const { version } = await Bun.file("apps/web/package.json").json();
            const tag = process.env.GITHUB_REF_NAME;
            if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag ?? "") ||
                tag !== `v${version}`) {
              throw new Error("The release tag must match the stable version in apps/web/package.json");
            }
            const notes = await Bun.file("CHANGELOG.md").text();
            if (!notes.includes(`## [${version}] - `)) {
              throw new Error("Add dated release notes to CHANGELOG.md before deploying");
            }
          '

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check web and desktop
        run: |
          bun run lint
          bun run --cwd apps/desktop lint

      - name: Run unit tests
        run: bun run test:unit

      - name: Run desktop adapter tests
        run: bun run --cwd apps/desktop test

      - name: Run integration tests
        run: bun run test:integration

      - name: Set up Node for browser regressions
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check real browser persistence and private messaging
        timeout-minutes: 5
        env:
          CHROMIUM_PATH: google-chrome
        run: |
          node apps/web/scripts/run-browser-check.mjs --conversations
          node apps/web/scripts/run-messaging-check.mjs

  desktop-dev:
    name: Desktop development build
    needs: checks
    if: github.ref_type != 'tag'
    uses: ./.github/workflows/desktop-dev.yml

  deploy-dev:
    name: Deploy development site
    needs: checks
    if: >-
      github.repository == '99percentpeople/weblink' &&
      github.ref == 'refs/heads/public' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.event.deleted != true
    uses: ./.github/workflows/web-dev.yml
    secrets: inherit

  deploy-production:
    name: Deploy production release
    needs: checks
    if: >-
      github.repository == '99percentpeople/weblink' &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      github.event.deleted != true
    uses: ./.github/workflows/web-production.yml
    secrets: inherit

  desktop-production:
    name: Desktop production build
    needs: checks
    if: >-
      github.repository == '99percentpeople/weblink' &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      github.event.deleted != true
    uses: ./.github/workflows/desktop-production.yml
