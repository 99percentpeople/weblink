name: CI

on:
  pull_request:
  push:
    branches:
      - public
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    paths-ignore:
      - "apps/www/**"
      - ".github/workflows/www-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    # Full correctness checks belong to PRs/public, not the release tag again.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Vitest runs in Node. Node 22 clones File as Blob, losing metadata before
      # fake-indexeddb can exercise the browser's File persistence contract.
      - name: Set up Node for checks and browser regressions
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check web and desktop
        run: |
          bun run lint
          bun run --cwd apps/desktop lint

      - name: Run unit tests
        run: bun run test:unit

      - name: Run desktop adapter tests
        run: bun run --cwd apps/desktop test

      - name: Run integration tests
        run: bun run test:integration

      - name: Check real browser persistence and private messaging
        timeout-minutes: 5
        env:
          CHROMIUM_PATH: google-chrome
        run: |
          dbus-run-session -- node apps/web/scripts/run-browser-check.mjs --cache
          dbus-run-session -- node apps/web/scripts/run-browser-check.mjs --conversations
          dbus-run-session -- node apps/web/scripts/run-messaging-check.mjs

  release-validation:
    name: Validate release metadata
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # This validator uses only built-ins; no workspace install is needed.
      - run: bun scripts/release-metadata.mjs "$GITHUB_REF_NAME"

  desktop-dev:
    name: Desktop development build
    needs: checks
    if: github.ref_type != 'tag'
    uses: ./.github/workflows/desktop-dev.yml
    secrets: inherit

  deploy-dev:
    name: Deploy development site
    needs: checks
    if: >-
      github.repository == '99percentpeople/weblink' &&
      github.ref == 'refs/heads/public' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.event.deleted != true
    uses: ./.github/workflows/web-dev.yml
    secrets: inherit

  deploy-production:
    name: Deploy production release
    needs: release-validation
    if: >-
      github.repository == '99percentpeople/weblink' &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      github.event.deleted != true
    uses: ./.github/workflows/web-production.yml
    secrets: inherit

  desktop-production:
    name: Desktop production build
    needs: release-validation
    if: >-
      github.repository == '99percentpeople/weblink' &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      github.event.deleted != true
    uses: ./.github/workflows/desktop-production.yml
    secrets: inherit
