name: Desktop development

on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: Windows desktop
    if: >-
      github.repository == '99percentpeople/weblink' &&
      github.ref == 'refs/heads/public' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.event.deleted != true
    runs-on: windows-latest
    timeout-minutes: 60
    environment: Preview
    env:
      WEBLINK_BUILD_CHANNEL: dev
      VITE_SHARE_URL: ${{ vars.VITE_SHARE_URL || 'https://dev.webl.ink' }}
      VITE_WEBSOCKET_URL: ${{ vars.VITE_WEBSOCKET_URL }}
      WEBLINK_STUN_SERVERS: ${{ vars.WEBLINK_STUN_SERVERS }}
      VITE_TURN_SERVERS: ${{ secrets.VITE_TURN_SERVERS }}
      # Keep native media optimized, but avoid the release profile's expensive fat LTO.
      # Tests and the executable share one dependency build within this job.
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_DEBUG: "0"

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Check native test runner
        run: bun test ./scripts/test/desktop-tests.test.mjs
      - name: Install Rust
        run: rustup toolchain install
      # Exercise the socket fixture before paying for the Tauri/native build.
      - name: Check loopback HTTP test fixture
        run: |
          rustc --edition=2021 --test apps/desktop/src-tauri/src/updates/test_http.rs -o "$env:RUNNER_TEMP/weblink-http-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/weblink-http-tests.exe"
      # Public-repository caches are readable from fork PRs. Cache only public
      # registry packages, never private Git checkouts or native build outputs.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: public-crates-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: public-crates-${{ runner.os }}-
      - uses: ./.github/actions/private-sdk
        with:
          ssh-key: ${{ secrets.NATIVE_SDK_READ_KEY }}
      - run: bun install --frozen-lockfile
      - name: Verify desktop build configuration
        run: bun apps/web/scripts/check-build-env.ts desktop
      # Shared TypeScript checks and tests already passed in the caller's Checks job.
      - run: cargo fmt --all --check
      # Production-mode tests embed the frontend and use the CLI's Cargo features.
      - name: Build desktop frontend
        run: bun run --cwd apps/web build:desktop
      - name: Run native tests
        id: native-tests
        run: bun scripts/desktop-tests.mjs
      - name: Verify native file hover and drop lifecycle
        working-directory: apps/desktop/src-tauri
        env:
          DESKTOP_TEST_BINARY: ${{ steps.native-tests.outputs.desktop-test-binary }}
        # Run the exact artifact above without invoking Cargo/build scripts again.
        run: "& $env:DESKTOP_TEST_BINARY file_drop::windows::tests::real_ole_drop_delivers_files_without_clipboard_changes --exact --ignored --test-threads=1"
      - name: Build Windows executable
        run: bun run build:desktop --no-bundle --config src-tauri/tauri.ci.conf.json
      - uses: actions/upload-artifact@v7
        with:
          name: weblink-windows-x64
          path: target/release/weblink-desktop.exe
          if-no-files-found: error
