name: Pages domain setup

on:
  workflow_dispatch:
    inputs:
      site:
        description: Bind the custom domain and create its missing CNAME record
        type: choice
        options:
          - docs
          - www
        required: true

permissions:
  contents: read

concurrency:
  group: pages-domain-${{ inputs.site }}
  cancel-in-progress: false

jobs:
  setup:
    if: github.repository == '99percentpeople/weblink' && github.ref == 'refs/heads/public'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test scripts/test/setup-pages-domain.test.mjs
      - name: Configure Pages domain and DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE: ${{ inputs.site }}
        run: node scripts/setup-pages-domain.mjs "$SITE"
